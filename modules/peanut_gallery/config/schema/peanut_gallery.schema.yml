peanut_gallery.settings:
  type: config_object
  label: 'Peanut Gallery settings'
  mapping:
    default_allow_anonymous_comments:
      type: boolean
      label: 'Allow anonymous comments by default on new recordings'
    notification_emails:
      type: sequence
      label: 'Addresses notified when a recording comment is posted or edited'
      sequence:
        type: email
        label: 'Email address'
    comment_preroll_seconds:
      type: integer
      label: 'Seconds of context played before a comment moment when jumping to it'
    default_allow_downloads:
      type: boolean
      label: 'Offer a download link by default on new recordings'
