peanut_gallery.recordings:
  path: '/recordings'
  defaults:
    _controller: '\Drupal\peanut_gallery\Controller\RecordingListController::page'
    _title: 'Recordings'
  requirements:
    # Per-recording visibility is enforced by the entity query's
    # accessCheck() inside the controller; this only gates the page itself.
    _permission: 'access content'

peanut_gallery.invite_create:
  path: '/node/{node}/invite'
  defaults:
    _form: '\Drupal\peanut_gallery\Form\InviteCreateForm'
    _title: 'Invite'
  requirements:
    _permission: 'issue peanut gallery invites'
    _entity_access: 'node.update'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

peanut_gallery.invite_accept:
  path: '/invite/{code}'
  defaults:
    _form: '\Drupal\peanut_gallery\Form\InviteAcceptForm'
    _title: 'Accept your invitation'
  requirements:
    # Open by design: the code in the URL is the credential. Access is
    # decided inside the form, which treats unknown, expired and already
    # redeemed codes identically so the page cannot be used to probe them.
    _access: 'TRUE'

peanut_gallery.manifest:
  path: '/peanut-gallery/manifest.json'
  defaults:
    _controller: '\Drupal\peanut_gallery\Controller\PushController::manifest'
  requirements:
    # The manifest describes the site, not any content; iOS fetches it
    # before the visitor has done anything.
    _access: 'TRUE'

peanut_gallery.service_worker:
  path: '/peanut-gallery/service-worker.js'
  defaults:
    _controller: '\Drupal\peanut_gallery\Controller\PushController::serviceWorker'
  requirements:
    _access: 'TRUE'

peanut_gallery.push_subscribe:
  path: '/peanut-gallery/push/subscribe'
  defaults:
    _controller: '\Drupal\peanut_gallery\Controller\PushController::subscribe'
  methods: [POST]
  requirements:
    _permission: 'receive peanut gallery push notifications'
    # Same-origin proof: without it any site could silently register its
    # own push endpoint against a logged-in visitor of this one.
    _csrf_request_header_token: 'TRUE'

peanut_gallery.push_unsubscribe:
  path: '/peanut-gallery/push/unsubscribe'
  defaults:
    _controller: '\Drupal\peanut_gallery\Controller\PushController::unsubscribe'
  methods: [POST]
  requirements:
    _permission: 'receive peanut gallery push notifications'
    _csrf_request_header_token: 'TRUE'

peanut_gallery.settings:
  path: '/admin/config/media/peanut-gallery'
  defaults:
    _form: '\Drupal\peanut_gallery\Form\SettingsForm'
    _title: 'Peanut Gallery settings'
  requirements:
    _permission: 'administer peanut gallery settings'

peanut_gallery.peaks:
  path: '/peanut-gallery/peaks/{node}'
  defaults:
    _controller: '\Drupal\peanut_gallery\Controller\PeaksController::peaks'
  requirements:
    # Access is enforced inside the controller itself (via $node->access()),
    # which returns 404 rather than 403 for a denied node so an
    # unauthorized visitor can't distinguish "private" from "no such
    # recording" — the same posture as hook_file_download().
    _access: 'TRUE'
    node: \d+
  options:
    _format: json
    parameters:
      node:
        type: entity:node
